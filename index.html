<script>

        document.getElementById('loadingOverlay').style.display = 'none';

function fmtMoeda(valor) {
    if (valor === undefined || valor === null || valor === "") return "0,00";

    let n = valor;
    if (typeof valor === 'string') {
        n = parseFloat(valor.replace(/[R$\s.]/g, '').replace(',', '.'));
    }

    if (typeof valor === 'number') {
        return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    let stringLimpa = valor.toString().trim();
    
    if (stringLimpa.includes(',') && stringLimpa.includes('.')) {
        stringLimpa = stringLimpa.replace(/\./g, '').replace(',', '.');
    } 
    else if (stringLimpa.includes(',')) {
        stringLimpa = stringLimpa.replace(',', '.');
    }

    let num = parseFloat(stringLimpa);
    return isNaN(num) ? "0,00" : num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function prepararDataParaInput(dataStr) {
    if (!dataStr) return "";
    let s = String(dataStr).trim();
    
    if (s.includes('/')) {
        const partes = s.split('/');
        if (partes.length === 3) {
            return `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
        }
    }
    return s.split('T')[0];
}

    function ajustarFonte(delta) {
        const root = document.documentElement;
        const currentSize = parseFloat(getComputedStyle(root).getPropertyValue('--base-font'));
        const newSize = Math.min(Math.max(currentSize + delta, 10), 22);
        root.style.setProperty('--base-font', newSize + 'px');
    }

    function fmtDataBR(dataStr) {
        if (!dataStr || dataStr.length < 10) return "---";
        const parts = dataStr.includes('T') ? dataStr.split('T')[0].split('-') : dataStr.split('-');
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dataStr;
    }

    function showToast(m) { const x = document.getElementById("toast"); x.innerText = m; x.className = "show"; setTimeout(() => x.className = "", 3000); }

    function addSerie(btn) {
        const input = document.createElement("input");
        input.className = "p-serie";
        input.style.cssText = "margin-bottom: 5px; width: 100%; border: 1px solid var(--borda); padding: 8px; border-radius: 6px;";
        btn.previousElementSibling.appendChild(input);
    }

    function addProd() {
        const clone = document.querySelector(".prod-container").cloneNode(true);
        clone.querySelectorAll("input").forEach(i => i.value = "");
        clone.querySelector(".lista-series").innerHTML = '<input class="p-serie" style="margin-bottom: 5px; width: 100%; border: 1px solid var(--borda); padding: 8px; border-radius: 6px;">';
        document.getElementById("sessaoProdutos").appendChild(clone);
    }

    async function buscarProd(input) {
        if(!input.value) return;
        try {
            const res = await fetch(`${WEB_APP_URL}?action=getProduto&codigo=${input.value}`);
            const d = await res.json();
            const pai = input.closest(".prod-container");
            if (d && !d.error) {
                pai.querySelector(".p-descricao").value = d.descricao || "";
                pai.querySelector(".p-marca").value = d.marca || "";
                pai.querySelector(".p-referencia").value = d.referencia || "";
            }
        } catch(e) { console.error(e); }
    }

async function salvarTudo() {
    const cliente = document.getElementById("cliente").value;
    if(!cliente) return alert("Informe o cliente");
    
    const btn = document.getElementById("btnSalvar");
    btn.disabled = true; 
    btn.innerText = "Gravando...";

    const fixos = {
        cliente: cliente,
        vendedor: document.getElementById("vendedor").value,
        nf: document.getElementById("nf").value, 
        data_nf: document.getElementById("data_nf").value,
        nf_compra: document.getElementById("nf_compra").value, 
        data_nf_compra: document.getElementById("data_nf_compra").value,
        data_contato: document.getElementById("data_contato").value, 
        cadastrador: document.getElementById("cadastrador").value,
        tipo: document.getElementById("tipo").value, 
        credito: document.getElementById("credito").value,
        status_proc: document.getElementById("status_proc").value, 
        setor_compras: document.getElementById("setor_compras").value, 
        motivo: document.getElementById("motivo").value.trim(),
    };

    const prods = document.querySelectorAll(".prod-container");
    
    try {
        for (let b of prods) {
            const series = Array.from(b.querySelectorAll(".p-serie")).map(i => i.value).filter(v => v).join(" | ");
            const payload = { 
                ...fixos,
                codigo: b.querySelector(".p-codigo").value, 
                descricao: b.querySelector(".p-descricao").value,
                marca: b.querySelector(".p-marca").value, 
                referencia: b.querySelector(".p-referencia").value,
                qt: b.querySelector(".p-qt").value, 
                valor: b.querySelector(".p-valor").value, 
                n_serie: series
            };

            let url = WEB_APP_URL;
            if (editandoIdx !== null) { url += `?action=edit&idx=${editandoIdx}`; }

            await fetch(url, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        }
        alert(editandoIdx !== null ? "Registro atualizado! ✅" : "Salvo com sucesso!");
        editandoIdx = null; location.reload();
    } catch(e) { 
        alert("Erro na operação."); 
        btn.disabled = false; btn.innerText = "💾 Salvar Tudo"; 
    }
}

    async function sincronizar() {
        mostrarLoading();
        try {
            const res = await fetch(`${WEB_APP_URL}?t=${Date.now()}`);
            dadosCache = await res.json();
            atualizarDashboard(dadosCache);
            processarFiltros();
        } catch(e) { 
            console.error(e);
            const box = document.getElementById("listaCards");
            if(box) box.innerHTML = "<p style='color:red'>Erro ao carregar.</p>"; 
        } finally {
            ocultarLoading();
        }
    }

let timeoutFiltro;

function processarFiltros() {
    clearTimeout(timeoutFiltro);

    timeoutFiltro = setTimeout(() => {
        if (!dadosCache || dadosCache.length === 0) return;

        let listaOriginal = JSON.parse(JSON.stringify(dadosCache));
        let listaFiltrada = [...listaOriginal];
        
        const termo = (document.getElementById("campoBusca")?.value || "").toLowerCase().trim();
        const statusFiltro = (document.getElementById("filtroStatus")?.value || "TODOS").toUpperCase();

        const inicio = document.getElementById("dataInicio").value;
        const fim = document.getElementById("dataFim").value;

        function normalizar(data){
            if(!data) return null;
            let s = String(data).trim();
            if(s.includes("/")){
                let [d,m,y] = s.split("/");
                return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
            }
            if(s.includes("-")){
                return s.substring(0,10);
            }
            return null;
        }

        if(inicio || fim){
            listaFiltrada = listaFiltrada.filter(reg => {
                const datas = [
                    normalizar(reg.data_nf)
                ].filter(Boolean);

                for(let d of datas){
                    if(inicio && d < inicio) continue;
                    if(fim && d > fim) continue;
                    return true;
                }
                return false;
            });
        }

        if (termo.length > 0) {
            const termoNumerico = termo.replace(/[.,]/g, "");
            listaFiltrada = listaFiltrada.filter(d => {
                let vRaw = String(d.valor || "0").replace(',', '.');
                let valorNum = parseFloat(vRaw);
                const valorBancoLimpo = isNaN(valorNum) ? "" : valorNum.toFixed(2).replace(/[.,]/g, "");
                const campos = [
                    d.cliente, d.codigo, d.descricao, d.marca, d.referencia, d.qt, 
                    d.nf, d.data_nf, d.valor, d.vendedor, d.nf_compra, d.data_nf_compra, 
                    d.data_contato, d.n_serie, d.cadastrador, d.tipo, d.credito, 
                    d.status_proc, d.motivo, d.setor_compras
                ];
                const textoUnico = campos.map(v => String(v || "").toLowerCase()).join(" ");
                return textoUnico.includes(termo) || (valorBancoLimpo !== "" && valorBancoLimpo.includes(termoNumerico));
            });
        }

        if (statusFiltro !== "TODOS") {
            listaFiltrada = listaFiltrada.filter(d => {
                const s = String(d.status_proc || "").toUpperCase();
                return statusFiltro === "AGUARDANDO" ? s.includes("AGUARDANDO") : s.includes(statusFiltro);
            });
        }

        const ordem = document.getElementById("filtroOrdem")?.value || "recente";

        if (ordem === "recente") {
            listaFiltrada.sort((a, b) => (Number(b.realIdx) || 0) - (Number(a.realIdx) || 0));
        }
        else if (ordem === "antigo") {
            listaFiltrada.sort((a, b) => (Number(a.realIdx) || 0) - (Number(b.realIdx) || 0));
        }

        renderizar(listaFiltrada);
        atualizarDashboard(listaFiltrada);

    }, 500); 
}

 function renderizar(listaParaExibir) {
    const box = document.getElementById("listaCards");
    if (!box) return;

    box.innerHTML = "";
    
    if (!listaParaExibir || listaParaExibir.length === 0) {
        box.innerHTML = "<div style='text-align:center; padding:50px; width:100%;'><h3>Nenhum registro encontrado para este filtro.</h3></div>";
        return;
    }

    listaParaExibir.forEach((item) => {
        const idUnico = item.realIdx;
        
        let stStyle = "st-analise";
        const status = (item.status_proc || "").toUpperCase();
        if(status.includes("AGUARDANDO")) stStyle = "st-aguardando";
        if(status === "FINALIZADO") stStyle = "st-finalizado";

        let comprasStyle = "st-padrao";
        const statusCompras = (item.setor_compras || "").toUpperCase();
        if (statusCompras === "PENDENTE") comprasStyle = "st-pendente";
        else if (statusCompras === "SOLICITADO") comprasStyle = "st-solicitado";
        else if (statusCompras === "CONCEDIDA") comprasStyle = "st-concedida";
        else if (statusCompras.includes("NÃO APLICÁVEL") || statusCompras.includes("DEVOLUÇÃO"))
            comprasStyle = "st-devolucao";

        const card = document.createElement("div");
        card.className = "registro-item";
        card.innerHTML = `
            <div class="grid-header-list ">
                <div class="label-box"><b>CLIENTE</b><span>${item.cliente || '---'}</span></div>
                <div class="label-box"><b>QUANTIDADE</b><span>${item.qt || '0'}</span></div>
                <div class="label-box"><b>VALOR</b><span>${fmtMoeda(item.valor)}</span></div>
                <div class="label-box"><b>TIPO</b><span>${item.tipo || '0'}</span></div>
                <div class="label-box"><b>CREDITO</b><span>${item.credito || '---'}</span></div>
                <div class="label-box"><b>STATUS</b><span class="status-badge ${stStyle}">${item.status_proc || 'S/ STATUS'}</span></div>
                <div class="label-box"><b>SETOR COMPRAS</b><span class="status-badge ${comprasStyle}">${item.setor_compras || '---'}</span></div>
            </div>
            <div class="item-details"> 
                <b>Código:</b> ${item.codigo || '---'} | <b>Descrição:</b> ${item.descricao || '---'}  | <b>Marca:</b> ${item.marca || '---'} | <b>Referência:</b> ${item.referencia || '---'}<br> 
                <b>Nº Série:</b> ${item.n_serie || '---'} |
                <b>NF Compra:</b> ${item.nf_compra || '---'} | 
                <b>Data NF Compra:</b> ${fmtDataBR(item.data_nf_compra) || '---'} | 
                <b>NF Dev:</b> ${item.nf || '---'} | 
                <b>Data NF Dev:</b> ${fmtDataBR(item.data_nf) || '---'} | 
                <b>Data Contato:</b> ${fmtDataBR(item.data_contato) || '---'} <br>
                <b>Vendedor:</b> ${item.vendedor || '---'} | 
                <b>Colaborador:</b> ${item.cadastrador || '---'} | 
                <b>Motivo:</b> ${item.motivo || '---'}
            </div>
            <div class="action-column">
                <button class="btn-circle" style="background: #1a4a7a;" onclick="visualizarCadastro(${idUnico})">👁️</button>
                <button class="btn-circle" style="background: #f2c300; color: #000;" onclick="prepararEdicao(${idUnico})">✏️</button>
                <button class="btn-circle" style="background: #dc2626;" onclick="excluir(${idUnico})">🗑️</button>
            </div>
        `;
        box.appendChild(card);
    });
}

    function prepararEdicao(realIdx) {
    const item = dadosCache.find(d => d.realIdx === realIdx);
    if (!item) return;

    editandoIdx = item.realIdx;
    voltar();

    document.getElementById("cliente").value = item.cliente || "";
    document.getElementById("vendedor").value = item.vendedor || "";
    document.getElementById("nf").value = item.nf || "";
    document.getElementById("data_nf").value = prepararDataParaInput(item.data_nf) || "";
    document.getElementById("nf_compra").value = item.nf_compra || "";
    document.getElementById("data_nf_compra").value = prepararDataParaInput(item.data_nf_compra) || "";
    document.getElementById("data_contato").value = prepararDataParaInput(item.data_contato) || "";
    document.getElementById("status_proc").value = item.status_proc || "";
    document.getElementById("credito").value = item.credito || "";
    document.getElementById("motivo").value = item.motivo || "";
    document.getElementById("cadastrador").value = item.cadastrador || "";
    document.getElementById("tipo").value = item.tipo || "";
    document.getElementById("setor_compras").value = item.setor_compras || "";

    const pContainer = document.querySelector(".prod-container");
    pContainer.querySelector(".p-codigo").value = item.codigo || "";
    pContainer.querySelector(".p-descricao").value = item.descricao || "";
    pContainer.querySelector(".p-marca").value = item.marca || "";
    pContainer.querySelector(".p-referencia").value = item.referencia || "";
    pContainer.querySelector(".p-qt").value = item.qt || "";
    pContainer.querySelector(".p-valor").value = fmtMoeda(item.valor) || "";

    const listaSeries = pContainer.querySelector(".lista-series");
    listaSeries.innerHTML = "";
    const series = (item.n_serie || "").split(" | ");
    series.forEach(s => {
        const input = document.createElement("input");
        input.className = "p-serie";
        input.value = s;
        input.style.cssText = "margin-bottom: 5px; width: 100%; border: 1px solid var(--borda); padding: 8px; border-radius: 6px;";
        listaSeries.appendChild(input);
    });

    document.getElementById("btnSalvar").innerText = "Atualizar Registro";
    document.getElementById("statusEdicao").classList.remove("hidden");
}

function atualizarDashboard(listaParaSomar) {
    const elTotal = document.getElementById("txtTotal");
    const elValorTotal = document.getElementById("txtValorTotal");
    const elFin = document.getElementById("txtFinalizado");
    const elAna = document.getElementById("txtAnalise");
    const elAgu = document.getElementById("txtAguardando");
    const elDen = document.getElementById("txtDenegada");
    const elDev = document.getElementById("txtDevolvido ao Cliente");

    let somaGeral = 0;
    let qtdFin = 0;
    let qtdAna = 0;
    let qtdAgu = 0;
    let qtdDen = 0;
    let qtdDev = 0;

    if (!listaParaSomar || listaParaSomar.length === 0) {
        if (elTotal) elTotal.innerText = "0";
        if (elValorTotal) elValorTotal.innerText = "R$ 0,00";
        if (elFin) elFin.innerText = "0";
        if (elAna) elAna.innerText = "0";
        if (elAgu) elAgu.innerText = "0";
        if (elDen) elDen.innerText = "0";
        if (elDev) elDev.innerText = "0";
        return;
    }

    for (let i = 0; i < listaParaSomar.length; i++) {
        let item = listaParaSomar[i];
        let st = String(item.status_proc || "").toUpperCase();

        if (st === "FINALIZADO") {
            qtdFin++;
        } 
        else if (st === "EM ANALISE") {
            qtdAna++;
        } 
        else if (st.includes("AGUARDANDO")) {
            qtdAgu++;
        }
        else if (st.includes("DENEGADA")) {
            qtdDen++;
        }
        else if (st.includes("DEVOLVIDO AO CLIENTE")) {
            qtdDev++;
        }

        let v = item.valor;
        if (v !== undefined && v !== null && v !== "") {
            let valorStr = String(v).trim();
            valorStr = valorStr.replace(/[R$\s]/g, "");

            if (valorStr.includes(",") && valorStr.includes(".")) {
                valorStr = valorStr.replace(/\./g, "").replace(",", ".");
            }
            else if (valorStr.includes(",")) {
                valorStr = valorStr.replace(",", ".");
            }

            let numero = parseFloat(valorStr);
            if (!isNaN(numero)) {
                somaGeral += numero;
            }
        }
    }

    if (elTotal) elTotal.innerText = listaParaSomar.length;
    if (elFin) elFin.innerText = qtdFin;
    if (elAna) elAna.innerText = qtdAna;
    if (elAgu) elAgu.innerText = qtdAgu;
    if (elDen) elDen.innerText = qtdDen;
    if (elDev) elDev.innerText = qtdDev;

    if (elValorTotal) {
        elValorTotal.innerText = "R$ " + somaGeral.toLocaleString('pt-BR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }
}

    function abrirLista() { 
        document.getElementById("formTela").classList.add("hidden"); 
        document.getElementById("listaTela").classList.remove("hidden"); 
        document.getElementById("contadores").classList.remove("hidden"); 
        sincronizar(); 
    }

    function voltar() { 
        document.getElementById("formTela").classList.remove("hidden"); 
        document.getElementById("listaTela").classList.add("hidden"); 
        document.getElementById("contadores").classList.add("hidden"); 
    }

   async function excluir(realIdx) { 
    if(confirm("Deseja realmente excluir este registro?")) { 
        showToast("Excluindo...");
        await fetch(`${WEB_APP_URL}?action=delete&idx=${realIdx}`, {
            method: "POST", 
            mode: "no-cors"
        }); 
        
        setTimeout(() => {
            sincronizar();
            showToast("Excluído com sucesso!");
        }, 1000);
    } 
}

    // Executa sincronização inicial com carregamento visual
    sincronizar();
</script>

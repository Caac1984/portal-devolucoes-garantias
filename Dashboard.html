<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Analytics</title>
    <link rel="icon" type="image/x-icon" href="icon-192.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --cor-azul: #1a4a7a; --cor: #F2C300; --borda: #d0d5dd; 
            --erro: #dc2626; --verde: #28a745; --laranja: #f97316; 
            --base-font: 13px; 
        }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; padding: 15px; 
            background: #eef2f5; 
            color: #101828; 
            font-size: var(--base-font); 
        }

        .bg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(152deg, #fbff05, #0d0d0d, #fbff05); opacity: 0.95; }
        .container { max-width: 1240px; margin: auto; }

        .header { 
            background: white; padding: 10px 25px; border-radius: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 12px rgba(0,0,0,.15); border-top: 8px solid var(--cor); 
            margin-bottom: 15px; 
        }
        .logo-k { height: 45px; width: auto; }

        .dashboard-stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; margin-bottom: 20px; 
        }
        .stat-card { 
            background: white; padding: 15px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-bottom: 5px solid var(--cor-azul); 
        }
        .stat-card b { font-size: 0.85em; text-transform: uppercase; color: #666; }
        .stat-card span { font-size: 1.5em; font-weight: 800; color: var(--cor-azul); }

        .main-card { 
            background: white; padding: 25px; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-top: 5px solid var(--cor-azul); 
            margin-bottom: 20px;
        }

        .nav-menu { display: flex; gap: 8px; background: #A9A9A9; padding: 5px; border-radius: 10px; align-items: center; }
        .nav-btn {
            text-decoration: none;
            color: #00008B;
            font-weight: bold;
            font-size: 0.85em;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-btn:hover { background: #e2e5e9; color: var(--cor-azul); }
        .nav-btn.active { background: white; color: var(--cor-azul); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .search-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 0.8em; margin-bottom: 4px; font-weight: 800; color: #475467; text-transform: uppercase; }
        input, select { padding: 8px; border-radius: 6px; border: 1px solid var(--borda); font-size: 1em; width: 100%; box-sizing: border-box; }

        .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85em; transition: 0.2s; }
        .primary { background: var(--cor-azul); color: white; }
        .secondary { background: var(--cor); color: var(--cor-azul); }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-wrapper { height: 320px; position: relative; }

        .product-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        .product-table th { text-align: left; padding: 12px; background: #f8f9fa; color: var(--cor-azul); font-size: 0.8em; text-transform: uppercase; border-bottom: 2px solid var(--borda); }
        .product-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9em; color: #333; }
        .product-table tr:hover { background: #f1f4f9; }

        .loading-overlay { 
            position: fixed; inset: 0; background: rgba(255,255,255,0.85); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            gap: 15px; z-index: 5000; 
        }

        /* Dropdown */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: #000080; color: #FFFFFF; font-weight: bold; font-size: 1.2em; padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; }
        .dropbtn:hover { background: #87CEFA; color: #FFFFFF; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border-radius: 8px; z-index: 1000; overflow: hidden; }
        .dropdown-content a { color: #333; padding: 10px 12px; text-decoration: none; display: block; font-size: 1.1em; transition: 0.2s; }
        .dropdown-content a:hover { background: #87CEFA; }
        .dropdown:hover .dropdown-content { display: block; }
    </style>
</head>
<body>

<div class="bg"></div>

<!-- SPINNER DE CARREGAMENTO -->
<div id="loader" class="loading-overlay">
    <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--cor-azul);"></i>
    <span style="font-weight: bold; color: var(--cor-azul); font-size: 1.1em;">Carregando dados, por favor aguarde...</span>
</div>

<div class="container">
    <div class="header">
        <div class="dropdown">
            <button class="dropbtn">☰ Menu</button>
            <div class="dropdown-content">
                <a href="index.html" class="nav-btn">📊 Cadastro</a>
                <a href="Compras.html" class="nav-btn">📊 Setor Compras</a>
            </div>
        </div>

        <img src="logo.png" alt="Logo" class="logo">
        <h1 style="font-size: 1.3em; color: var(--cor-azul); margin:0;">Dashboard Analytics</h1>
        <div style="display:flex; gap:10px; align-items: center;">
            <button class="btn secondary" onclick="fetchData()">🔄 Sincronizar</button>
            <button class="btn primary" onclick="window.location.reload()">🏠 Início</button>
        </div>
    </div>

    <div class="dashboard-stats">
        <div class="stat-card"><b>Total Itens</b><span id="countTotal">0</span></div>
        <div class="stat-card"><b>Garantia</b><span id="valGarantia">R$ 0,00</span></div>
        <div class="stat-card"><b>Devolução</b><span id="valDevolucao">R$ 0,00</span></div>
        <div class="stat-card" style="border-bottom-color: var(--cor)"><b>Soma Total</b><span id="valTotalGeral">R$ 0,00</span></div>
    </div>

    <div class="main-card">
        <div class="search-container">
            <div class="field"><label>Busca Global</label><input type="text" id="dbSearch" placeholder="Código, Descrição" onkeyup="filterCharts()"></div>
            <div class="field">
                <label>Selecionar Cliente</label>
                <select id="fCliente" onchange="filterCharts()">
                    <option value="">-- TODOS OS CLIENTES --</option>
                </select>
            </div>
            <div class="field"><label>Status</label>
                <select id="fStatus" onchange="filterCharts()">
                    <option value="">-- TODOS OS STATUS --</option>
                    <option value="EM ANALISE">EM ANALISE</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                    <option value="NÃO APLICAVEL">NÃO APLICAVEL (DEVOLUÇÃO)</option>
                    <option value="AGUARDANDO">AGUARDANDO...</option>
                </select>
            </div>
            <div class="field"><label>Data Início</label><input type="date" id="fDataInicio" onchange="filterCharts()"></div>
            <div class="field"><label>Data Fim</label><input type="date" id="fDataFim" onchange="filterCharts()"></div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="main-card chart-wrapper">
            <label>Distribuição por Status Cliente</label>
            <canvas id="chartStatus"></canvas>
        </div>
        <div class="main-card chart-wrapper">
            <label>Setor Compras / Fornecedor</label>
            <canvas id="chartCompras"></canvas>
        </div>
        <div class="main-card chart-wrapper">
            <label>As 5 Marcas com mais problemas</label>
            <canvas id="chartMarcas"></canvas>
        </div>
    </div>

    <div id="productTableSection" class="main-card" style="display: none;">
        <h4 style="margin:0 0 15px 0; color: var(--cor-azul); text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            <i class="fas fa-list"></i> Produtos Vinculados: <span id="clientTitle" style="color: var(--laranja);"></span>
        </h4>
        <div style="overflow-x: auto;">
            <table class="product-table">
                <thead>
                    <tr>
                        <th>Cód. Item</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>NF Dev.</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let charts = {};
    const WEB_APP_URL = "insira o caminho do google planilhas aqui";

    function parseMoeda(v) {
        if (!v) return 0;
        let s = String(v).trim().replace(/R\$/g, "").replace(/\s/g, "");
        if (s.includes(',')) s = s.replace(/\./g, "").replace(',', '.');
        else if (s.includes('.')) {
            const p = s.split('.');
            if (p.length > 2 || (p[1] && p[1].length === 3)) s = s.replace(/\./g, "");
        }
        return parseFloat(s) || 0;
    }

    async function fetchData() {
        document.getElementById('loader').style.display = 'flex';
        try {
            const res = await fetch(`${WEB_APP_URL}?t=${Date.now()}`);
            rawData = await res.json();
            
            const select = document.getElementById('fCliente');
            const clientes = [...new Set(rawData.map(d => String(d.cliente || "").trim()))].filter(Boolean).sort();
            select.innerHTML = '<option value="">-- TODOS OS CLIENTES --</option>';
            clientes.forEach(c => { select.innerHTML += `<option value="${c}">${c}</option>`; });

            updateDashboard(rawData);
        } catch (e) { 
            console.error("Erro na busca:", e); 
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function updateDashboard(data) {
        let g = 0, d = 0;
        data.forEach(item => {
            const v = parseMoeda(item.valor);
            const t = String(item.tipo || "").toUpperCase();
            if (t.includes("GARANTIA")) g += v;
            else if (t.includes("DEVOLUCAO") || t.includes("DEVOLUÇÃO")) d += v;
        });

        const fmt = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('countTotal').innerText = data.length;
        document.getElementById('valGarantia').innerText = fmt(g);
        document.getElementById('valDevolucao').innerText = fmt(d);
        document.getElementById('valTotalGeral').innerText = fmt(g + d);
        
        renderCharts(data);
    }

    function renderCharts(data) {
        const count = (arr, key) => arr.reduce((acc, o) => { 
            let v = (o[key] || 'NÃO INFORMADO').toUpperCase().trim(); 
            acc[v] = (acc[v] || 0) + 1; return acc; 
        }, {});

        const sD = count(data, 'status_proc');
        const cD = count(data, 'setor_compras'); 
        const mD = count(data, 'marca');

        if (charts.s) charts.s.destroy();
        if (charts.c) charts.c.destroy();
        if (charts.m) charts.m.destroy();

        const coresStatus = Object.keys(sD).map(label => {
            if (label.includes("FINALIZADO")) return '#28a745';
            if (label.includes("AGUARDANDO")) return '#F2C300';
            return '#1a4a7a';
        });

        charts.s = new Chart(document.getElementById('chartStatus'), { 
            type: 'bar', 
            data: { labels: Object.keys(sD), datasets: [{ data: Object.values(sD), backgroundColor: coresStatus, borderRadius: 5 }] }, 
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        const ordemDesejada = [
            "SOLICITADO",
            "PENDENTE",
            "CONCEDIDA",
            "CONCEDIDO",
            "NÃO APLICÁVEL (Devolução)",
            "NÃO APLICAVEL"
        ];

        const normalizarParaOrdem = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().split('(')[0].trim();

        const dadosOrdenados = Object.entries(cD).sort((a, b) => {
            const labelA = normalizarParaOrdem(a[0]);
            const labelB = normalizarParaOrdem(b[0]);

            let idxA = ordemDesejada.findIndex(item => normalizarParaOrdem(item) === labelA);
            let idxB = ordemDesejada.findIndex(item => normalizarParaOrdem(item) === labelB);
            
            if (idxA === -1) idxA = 99; 
            if (idxB === -1) idxB = 99;

            return idxA - idxB;
        });

        const labelsFinal = dadosOrdenados.map(item => item[0]);
        const valoresFinal = dadosOrdenados.map(item => item[1]);

        const coresCompras = labelsFinal.map(label => {
            const l = normalizarParaOrdem(label);
            if (l.includes("SOLICITADO")) return '#007bff';
            if (l.includes("PENDENTE")) return '#F2C300';
            if (l.includes("CONCEDIDA") || l.includes("CONCEDIDO")) return '#28a745';
            return '#6c757d';
        });

        charts.c = new Chart(document.getElementById('chartCompras'), { 
            type: 'bar', 
            data: { 
                labels: labelsFinal, 
                datasets: [{ data: valoresFinal, backgroundColor: coresCompras, borderRadius: 5 }] 
            }, 
            options: { 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        ticks: {
                            autoSkip: false,
                            maxRotation: 45,
                            minRotation: 45
                        }
                    }
                }
            }
        });
        
        const top5 = Object.entries(mD).sort((a,b) => b[1]-a[1]).slice(0,5);
        charts.m = new Chart(document.getElementById('chartMarcas'), { 
            type: 'pie', 
            data: { labels: top5.map(x=>x[0]), datasets: [{ data: top5.map(x=>x[1]), backgroundColor: ['#1a4a7a','#F2C300','#28a745','#f97316','#bdc3c7'] }] }, 
            options: { maintainAspectRatio: false } 
        });
    }

    function filterCharts() {
        const search = document.getElementById('dbSearch').value.toLowerCase();
        const clienteSel = document.getElementById('fCliente').value;
        const statusSel = document.getElementById('fStatus').value;
        const ini = document.getElementById('fDataInicio').value;
        const fim = document.getElementById('fDataFim').value;

        const normalizar = (texto) => {
            return String(texto || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        };

        const termoStatusFiltro = normalizar(statusSel.split('(')[0]);

        const filtered = rawData.filter(d => {
            const dCliente = String(d.cliente || "").trim();
            const dStatusProc = normalizar(d.status_proc);
            const dSetorComp = normalizar(d.setor_compras);

            const matchesSearch = normalizar(d.codigo).includes(normalizar(search)) || 
                          normalizar(d.descricao).includes(normalizar(search));
            
            const matchesCliente = !clienteSel || dCliente === clienteSel;
            
            let matchesStatus = true;
            if (statusSel && statusSel !== "" && !statusSel.includes("--")) {
                matchesStatus = dStatusProc.includes(termoStatusFiltro) || dSetorComp.includes(termoStatusFiltro);
            }
            
            const dataItem = d.data_nf; 
            let matchesDate = true;
            if (ini && dataItem < ini) matchesDate = false;
            if (fim && dataItem > fim) matchesDate = false;

            return matchesSearch && matchesCliente && matchesStatus && matchesDate;
        });

        updateDashboard(filtered);

        const section = document.getElementById('productTableSection');
        const body = document.getElementById('productTableBody');
        
        if (clienteSel) {
            section.style.display = 'block';
            document.getElementById('clientTitle').innerText = clienteSel;
            body.innerHTML = filtered.length > 0 ? filtered.map(item => `
                <tr>
                    <td><b>${item.codigo || '-'}</b></td>
                    <td>${item.descricao || '-'}</td>
                    <td><small>${item.tipo || '-'}</small></td>
                    <td>R$ ${item.valor || '0,00'}</td>
                    <td>${item.nf || '-'}</td>
                </tr>
            `).join('') : '<tr><td colspan="5" style="text-align:center">Nenhum item para este filtro.</td></tr>';
        } else {
            section.style.display = 'none';
        }
    }

    window.onload = fetchData;
</script>
</body>
</html>
